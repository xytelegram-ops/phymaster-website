<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhyMaster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 40%, #16213e 70%, #0c0c0c 100%);
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #64b5f6, #42a5f5, #90caf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1rem;
            color: #666;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #888;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .links {
            margin-top: 2.5rem;
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .links a {
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
            letter-spacing: 1px;
        }

        .links a:hover {
            color: #90caf9;
        }

        footer {
            position: fixed;
            bottom: 2rem;
            color: #333;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">PhyMaster</div>
        <p class="subtitle">Coming Soon</p>
        <div class="status">
            <span class="dot"></span>
            <span>Site Under Construction</span>
        </div>
        <div class="links">
            <a href="https://github.com">GitHub</a>
            <a href="mailto:admin@phymaster.top">Contact</a>
        </div>
    </div>
    <footer>&copy; 2026 PhyMaster</footer>
</body>
</html>
